version: '3'
services:
    ols4-dataload:
      build:
        context: .
        dockerfile: Dockerfile.dataload # Extend in order to symlink neo4j volumes
      environment:
        - JAVA_OPTS=${JAVA_OPTS}
      # Pinned to the last upstream build before PR #1171 (2026-02-14) deleted
      # `dataload.dockersh`. The current `:dev` tag is broken (CMD references a
      # file that no longer ships in the image). Bump only after verifying that
      # the new upstream nextflow-based pipeline has been adopted here.
      image: ghcr.io/ebispot/ols4-dataload:a7fb62ffb006671fba21a3e62164c7b6a25a7ae7
      volumes:
        - ols4-solr-data:/opt/solr/server/solr:rw
        - ols4-neo4j-data:/opt/neo4j/data:rw
        - ./${OLS4_CONFIG:?OLS4 dataload requires a config file}:/mnt/config/config.json:ro
        - ./ontologies:/mnt/ontologies:ro
          #- ./testcases:/opt/ols/dataload/testcases:ro
        - ./tmp:/tmp/out:rw
      command: ./dataload.dockersh ${OLS4_DATALOAD_ARGS:-}
    ols4-solr:
      image: solr:9.8.1
      environment:
        - SOLR_HOME=/mnt/ols4-solr-data
      ports:
        - 8983:8983
      volumes:
        - ols4-solr-data:/mnt/ols4-solr-data
      command: ["-f"]
      #depends_on:
      #  ols4-dataload:
      #    condition: service_completed_successfully
    ols4-neo4j:
      image: neo4j:2025.03.0-community
      ports:
        - 7474:7474
        - 7687:7687
      volumes:
        - ols4-neo4j-data:/var/lib/neo4j/data
      environment:
        - NEO4J_AUTH=none
      #depends_on:
      #  ols4-dataload:
      #    condition: service_completed_successfully
    ols4-backend:
      # Pinned in lockstep with ols4-dataload (see note above).
      image: ghcr.io/ebispot/ols4-backend:a7fb62ffb006671fba21a3e62164c7b6a25a7ae7
      ports:
        - 8009:8080
      environment:
        - OLS_SOLR_HOST=http://ols4-solr:8983
        - OLS_NEO4J_HOST=bolt://ols4-neo4j:7687
      depends_on:
        - ols4-solr
        - ols4-neo4j    
      links:
        - ols4-solr
        - ols4-neo4j 
    ols4-frontend:
      # Pinned in lockstep with ols4-dataload (see note above).
      image: ghcr.io/ebispot/ols4-frontend:a7fb62ffb006671fba21a3e62164c7b6a25a7ae7
      env_file: ./frontend/.env
      ports:
        - 8008:8080
      depends_on:
        - ols4-backend
      links:
        - ols4-backend
      volumes:
        - ./frontend/Home.tsx:/opt/ols4-frontend/src/pages/home/Home.tsx
        - ./frontend/Header.tsx:/opt/ols4-frontend/src/components/Header.tsx
        - ./frontend/Footer.tsx:/opt/ols4-frontend/src/components/Footer.tsx
    #run-api-tests:
    #  profiles: ["run-api-tests"]
    #  build: ./apitester4
    #  volumes:
    #    - ${OLS4_APITEST_OUTDIR:-./to_be_filled_by_script_outdir}:/mnt/out:rw
    #    - ${OLS4_APITEST_COMPAREDIR:-./to_be_filled_by_script_comparedir}:/mnt/compare:rw
    #  command: ["bash", "-c", "chown -R apitester:apitester /mnt && su -c \"java -jar /opt/apitester/target/apitester-1.0-SNAPSHOT-jar-with-dependencies.jar --url http://ols4-backend:8080 --outDir /mnt/out --compareDir /mnt/compare --deep > /mnt/out/apitester4.log\" apitester"]
    #  depends_on:
    #    - ols4-backend
    #  links:
    #    - ols4-backend
volumes:
    ols4-neo4j-data:
    ols4-solr-data:
